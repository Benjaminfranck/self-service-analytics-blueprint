<svg xmlns="http://www.w3.org/2000/svg" width="820" height="599" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="820" height="599" rx="10" fill="#0d1117"/>
<rect width="820" height="38" rx="10" fill="#161b22"/>
<rect y="28" width="820" height="10" fill="#161b22"/>
<circle cx="20" cy="19" r="6" fill="#ff5f56"/>
<circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="19" r="6" fill="#27c93f"/>
<text x="410.0" y="24" fill="#8b949e" text-anchor="middle" font-size="12">demo.py — self-service-analytics (Postgres)</text>
<text x="18" y="70" fill="#7ee787" xml:space="preserve">$ python demo.py</text>
<text x="18" y="91" fill="#8b949e" xml:space="preserve">                                   # tenant: acme</text>
<text x="18" y="133" fill="#79c0ff" xml:space="preserve">Q: How many open critical findings are there right now?</text>
<text x="18" y="154" fill="#e6edf3" xml:space="preserve">   → {&#x27;open_critical_findings&#x27;: 6}</text>
<text x="18" y="196" fill="#79c0ff" xml:space="preserve">Q: Open critical findings on internet-facing assets, by team, last 30d</text>
<text x="18" y="217" fill="#e6edf3" xml:space="preserve">   → {&#x27;team&#x27;: &#x27;payments&#x27;, &#x27;open_critical_findings&#x27;: 3}</text>
<text x="18" y="238" fill="#e6edf3" xml:space="preserve">   → {&#x27;team&#x27;: &#x27;platform&#x27;, &#x27;open_critical_findings&#x27;: 2}</text>
<text x="18" y="259" fill="#8b949e" xml:space="preserve">   SQL  SELECT o.team, count(*)  FROM fct_findings f</text>
<text x="18" y="280" fill="#8b949e" xml:space="preserve">        JOIN dim_assets a … JOIN dim_owners o …</text>
<text x="18" y="301" fill="#8b949e" xml:space="preserve">        WHERE f.tenant = %(tenant)s        -- injected server-side</text>
<text x="18" y="322" fill="#8b949e" xml:space="preserve">          AND f.severity=&#x27;critical&#x27; AND f.status=&#x27;open&#x27;</text>
<text x="18" y="343" fill="#8b949e" xml:space="preserve">          AND a.is_internet_facing AND f.detected_at &gt;= now()-&#x27;30 days&#x27;</text>
<text x="18" y="364" fill="#8b949e" xml:space="preserve">   Source: semantic layer · Freshness: 2026-06-24 · Reviewed: ✓</text>
<text x="18" y="406" fill="#79c0ff" xml:space="preserve">Q: MTTR for criticals, this quarter   → {&#x27;mttr_hours&#x27;: 80.0}</text>
<text x="18" y="427" fill="#79c0ff" xml:space="preserve">Q: Critical SLA compliance rate, by business unit</text>
<text x="18" y="448" fill="#e6edf3" xml:space="preserve">   → retail 0.5  ·  platform 0.333  ·  data 0.0</text>
<text x="18" y="490" fill="#79c0ff" xml:space="preserve">Q: (adversarial) unknown metric &#x27;agent_blast_radius_score&#x27;</text>
<text x="18" y="511" fill="#f0883e" xml:space="preserve">   ✗ fails CLOSED → {&#x27;error&#x27;: &#x27;no_such_metric&#x27;, &#x27;suggestions&#x27;: […]}</text>
<text x="18" y="553" fill="#d2a8ff" xml:space="preserve"># tenant isolation   globex → 3   (acme → 6)   ✓</text>
<text x="18" y="574" fill="#d2a8ff" xml:space="preserve"># read-only          INSERT → &quot;cannot execute in a read-only transaction&quot;  ✓</text>
</svg>